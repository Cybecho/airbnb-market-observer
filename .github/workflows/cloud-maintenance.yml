name: Cloud maintenance
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Apply reviewed Atlas upgrade or update the dependency lockfile
        type: choice
        options: [upgrade, lockfile]
        default: upgrade
permissions:
  contents: write
concurrency:
  group: cloud-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Apply reviewed sources on GitHub Linux only
        if: inputs.operation == 'upgrade'
        run: node scripts/cloud-upgrade-v2.mjs
      - name: Lockfile only
        if: inputs.operation == 'lockfile'
        run: npm install --package-lock-only --ignore-scripts
      - name: Install on GitHub Linux only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends proj-bin unzip
          command -v iconv
          npm ci --ignore-scripts
      - name: Format and rebuild deterministic data
        run: |
          npx prettier --write src scripts docs tests README.md package.json package-lock.json
          npm run data:build
      - name: Validate data and production dependencies
        run: |
          npm run data:check
          npm run check:publication
          npm audit --omit=dev --audit-level=high
      - name: Test and build on Linux
        run: |
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: atlas-upgrade-browser-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
      - name: Commit only verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts data public docs tests README.md package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Upgrade Seoul research atlas with 24-month trends and private data adapters'
            git push
          fi
      - name: Deployment handoff
        run: echo 'Verified source commit is ready. Run Validate and publish Pages on main for the tested deployment.'
