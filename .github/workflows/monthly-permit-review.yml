name: Monthly permit origin review (aggregate only)
on:
  push:
    branches: [monthly-license-flows-v1]
  workflow_dispatch:
    inputs:
      task:
        description: Read only; no automatic publication
        type: choice
        options: [profile, collect]
        default: profile
permissions: {contents: read}
jobs:
  review:
    if: github.repository == 'Cybecho/airbnb-market-observer' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[원장검산]') || contains(github.event.head_commit.message, '[월집계]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: 24}
      - name: Verify four existing anonymous exports and return only reviewed aggregates
        env:
          COLLECT: ${{ inputs.task == 'collect' || contains(github.event.head_commit.message, '[월집계]') }}
        run: |
          set -euo pipefail
          if ! command -v cs2cs >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends proj-bin; fi
          if [ "$COLLECT" = true ]; then node scripts/monthly/review.mjs --collect; else node scripts/monthly/review.mjs --profile; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-monthly-permit-evidence
          path: ${{ runner.temp }}/permit-release
          retention-days: 5
          if-no-files-found: error
