name: Official data refresh and publish
on:
  schedule:
    - cron: '17 21 * * 0' # Monday 06:17 Asia/Seoul; GitHub scheduling may be delayed.
  workflow_dispatch:
    inputs:
      operation:
        description: Refresh official data, validate without publishing, or initialize reviewed collectors
        type: choice
        options: [refresh, check, install]
        default: refresh
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'Cybecho/airbnb-market-observer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      data_commit: ${{ steps.commit.outputs.sha }}
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Initialize reviewed collectors on Linux only
        if: inputs.operation == 'install'
        run: node scripts/cloud-upgrade-v2.mjs
      - name: Install isolated Linux toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends proj-bin unzip
          npm ci --ignore-scripts
      - name: Format reviewed source installation
        if: inputs.operation == 'install'
        run: npx prettier --write src scripts docs tests README.md package.json package-lock.json
      - name: Test parsers and application logic before network collection
        run: npm test
      - name: Collect only anonymous official public sources
        run: npm run data:refresh
      - name: Rebuild deterministic public payload and fail closed
        run: |
          npm run data:build
          npm run data:check
          npm run check:publication
          npm audit --omit=dev --audit-level=high
      - name: Build and exercise desktop, mobile and privacy regressions
        run: |
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Save aggregate-only diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official-refresh-diagnostics
          path: |
            .refresh-reports/refresh-report.json
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit only fully verified sources and aggregates
        id: commit
        if: inputs.operation != 'check'
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$base" = "$remote" || { echo 'Main changed during collection; not overwriting concurrent work.'; exit 1; }
          if [ "$OPERATION" = 'install' ]; then
            git add -- src scripts docs tests README.md package.json package-lock.json .gitignore
          fi
          git add -- data/organized/insights/observatory.json data/organized/insights/automation.json data/organized/insights/refresh-state.json public/data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified official Seoul data and source health'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Verified data commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Bind published artifact to verified data commit
        if: inputs.operation != 'check'
        env:
          DATA_COMMIT: ${{ steps.commit.outputs.sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
          BASE_COMMIT: ${{ github.sha }}
        run: node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('dist/build-provenance.json', JSON.stringify({schemaVersion:'1.0',dataCommit:process.env.DATA_COMMIT,baseCommit:process.env.BASE_COMMIT,workflowRun:process.env.WORKFLOW_RUN})+'\n');"
      - name: Prepare verified Pages artifact
        if: inputs.operation != 'check'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    if: inputs.operation != 'check'
    needs: refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the verified artifact directly
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  health:
    if: always() && inputs.operation != 'check'
    needs: [refresh, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Report failure once or close recovered health issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_RESULT: ${{ needs.refresh.result == 'success' && needs.deploy.result == 'success' && 'success' || 'failure' }}
        run: |
          if [ -f scripts/refresh-health.mjs ]; then
            node scripts/refresh-health.mjs
          else
            echo 'Initialization did not finish; check this failed Actions run. No previous publication was replaced.'
          fi
