name: Validate and publish Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install on GitHub Linux only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends proj-bin unzip
          command -v iconv
          npm ci --ignore-scripts
      - name: Rebuild and validate public data
        run: |
          npm run data:build
          npm run data:check
          npm run check:publication
          git diff --exit-code -- public/data
      - name: Check runtime dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests and production build
        run: |
          npm test
          npm run build
      - name: Install CI Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regressions
        run: npm run test:e2e
      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
      - name: Record verified build provenance
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          fs.writeFileSync("dist/build-provenance.json", JSON.stringify({
            schemaVersion: "1.0",
            dataCommit: process.env.GITHUB_SHA,
            baseCommit: process.env.GITHUB_SHA,
            workflowRun: process.env.GITHUB_RUN_ID
          }) + String.fromCharCode(10));
          NODE
      - name: Prepare verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy verified website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
