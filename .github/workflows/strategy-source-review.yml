name: Strategy source review (no keys)
on:
  workflow_dispatch:
    inputs:
      task:
        description: Source aggregate to inspect; no deployment or write access
        type: choice
        options: [land, night, history, osm]
        default: land
  push:
    branches: [muse-strategy-evidence-v1]
permissions:
  contents: read
jobs:
  land:
    if: github.repository == 'Cybecho/airbnb-market-observer' && (inputs.task == 'land' || contains(github.event.head_commit.message, '[자료확인:A4]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: 24}
      - name: Official ZIP metadata and nonidentifying structural counts only
        run: node scripts/strategy/land-source.mjs
  night:
    if: github.repository == 'Cybecho/airbnb-market-observer' && (inputs.task == 'night' || contains(github.event.head_commit.message, '[자료확인:A1]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {NODE_OPTIONS: '--max-old-space-size=3072'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: 24}
      - name: Replay only pinned Seoul archives and verify all legacy fields
        run: node scripts/materialize-night-presence.mjs
      - name: Validate public aggregates and package allowlisted outputs only
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/a1-materialized/observatory.json" data/organized/insights/observatory.json
          cp "$RUNNER_TEMP/a1-materialized/refresh-state.json" data/organized/insights/refresh-state.json
          npm run data:build
          npm run data:check
          npm run check:publication
          pk="$RUNNER_TEMP/night-package"
          mkdir -p "$pk"/data/organized/insights "$pk"/public/data "$pk"/docs/data
          cp data/organized/insights/{observatory,refresh-state}.json "$pk"/data/organized/insights/
          cp public/data/{observatory,build-manifest}.json "$pk"/public/data/
          cp "$RUNNER_TEMP/a1-materialized/ihwa.md" "$pk"/docs/data/NIGHT-PRESENCE-RESULTS.md
          cp "$RUNNER_TEMP/a1-materialized/lineage.json" "$pk"/docs/data/NIGHT-PRESENCE-LINEAGE.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reviewed-night-aggregates
          path: ${{ runner.temp }}/night-package
          if-no-files-found: error
          retention-days: 3
  history:
    if: github.repository == 'Cybecho/airbnb-market-observer' && (inputs.task == 'history' || contains(github.event.head_commit.message, '[자료확인:A2B4]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: 24}
      - name: Observe actual registry and official latest store, mobility and sales periods
        run: |
          set -euo pipefail
          node scripts/strategy/history-stores.mjs --collect
          if test -f public/strategy/v1/registry-history.json; then node scripts/strategy/history.mjs --append; else node scripts/strategy/history.mjs --seed; fi
          node scripts/strategy/history.mjs --check
          npm run check:publication
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reviewed-history-aggregates
          path: |
            public/strategy/v1/registry-history.json
            public/strategy/v1/context-history.json
          if-no-files-found: error
          retention-days: 3
  osm-initial:
    if: github.repository == 'Cybecho/airbnb-market-observer' && github.ref == 'refs/heads/muse-strategy-evidence-v1' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[자료확인:A6]')
    concurrency: amo-osm-quarter
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: 24}
      - name: One bounded OSM query and aggregate-only output
        run: |
          node scripts/strategy/osm-poi.mjs --collect --ledger-dir "$RUNNER_TEMP/osm-attempts"
          mkdir -p "$RUNNER_TEMP/osm-review/attempts"
          cp "$RUNNER_TEMP"/osm-attempts/*.json "$RUNNER_TEMP/osm-review/attempts/"
          if test -f public/strategy/v1/osm-poi.json; then cp public/strategy/v1/osm-poi.json "$RUNNER_TEMP/osm-review/"; fi
          npm run check:publication
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reviewed-osm-aggregates
          path: ${{ runner.temp }}/osm-review
          if-no-files-found: error
          retention-days: 3
